<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>N4 Kanji Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow column; a sticky tab strip switches six study modes; the big serif kanji is the visual centre. */
:root{
  --bg:#F1F3F8; --surface:#FFFFFF; --surface-2:#E8ECF5; --fg:#171E2E; --muted:#59627A; --line:#D5DBE8;
  --accent:#2C4AB0; --on-accent:#FFFFFF; --accent-soft:#DFE6FA;
  --good:#17744F; --good-soft:#D8F1E4; --bad:#B5352A; --bad-soft:#FAE0DC;
  --f-ui:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-jp:"Noto Sans JP","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
  --f-kanji:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1420; --surface:#171D2C; --surface-2:#212A3E; --fg:#E7EBF4; --muted:#9AA5BC; --line:#2A3348;
    --accent:#93A8FF; --on-accent:#0F1420; --accent-soft:#232D50;
    --good:#5DD3A3; --good-soft:#15362A; --bad:#FF9082; --bad-soft:#3C2121; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1420; --surface:#171D2C; --surface-2:#212A3E; --fg:#E7EBF4; --muted:#9AA5BC; --line:#2A3348;
  --accent:#93A8FF; --on-accent:#0F1420; --accent-soft:#232D50;
  --good:#5DD3A3; --good-soft:#15362A; --bad:#FF9082; --bad-soft:#3C2121; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--f-ui);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.shell{max-width:760px;margin:0 auto}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
h2{font-size:1.2rem;letter-spacing:-.01em;text-wrap:balance}
h3{font-size:1rem}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.eyebrow{font-size:.72rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.masthead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-top:20px;padding-bottom:14px}
.masthead h1{font-size:1.65rem;letter-spacing:-.02em;line-height:1.15}
.masthead h1 span{font-family:var(--f-kanji);font-weight:700;color:var(--accent);margin-left:.3em;font-size:.9em}
.daypill{text-align:right;font-size:.8rem;color:var(--muted);line-height:1.3;flex:none}
.daypill b{display:block;font:700 1.5rem/1 var(--f-kanji);color:var(--fg)}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;display:flex;gap:4px;overflow-x:auto;padding:8px 0;background:var(--bg);border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:1 0 auto;padding:9px 12px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:600;font-size:.88rem;text-align:center;white-space:nowrap}
.tabs a:hover{color:var(--fg)}
.tabs a[aria-current="page"]{background:var(--accent);color:var(--on-accent)}
.panel{display:grid;gap:18px;padding-top:20px}
.panel[hidden]{display:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.stack{display:grid;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:10px 16px;border-radius:10px;cursor:pointer;min-height:44px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.small{min-height:36px;padding:6px 12px;font-size:.86rem}
.chip{font:inherit;font-size:.86rem;font-weight:500;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;min-height:36px}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.field{font:inherit;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);min-height:44px;max-width:100%}
label.lbl{display:grid;gap:4px;font-size:.8rem;font-weight:600;color:var(--muted)}
.group{display:grid;gap:8px}
.group>.eyebrow{margin-bottom:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
/* quiz */
.qhead{display:flex;justify-content:space-between;gap:12px;font-size:.84rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.stage{text-align:center;padding:22px 10px 10px;display:grid;gap:10px}
.prompt{font-family:var(--f-kanji);font-weight:700;font-size:clamp(2.2rem,11vw,3.7rem);line-height:1.25;overflow-wrap:anywhere}
.prompt.u{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:.16em}
.prompt.kana{font-family:var(--f-jp);font-weight:500}
.prompt.sent{font-family:var(--f-jp);font-weight:500;font-size:clamp(1.3rem,5.5vw,1.8rem);line-height:1.8;text-align:left}
.uw{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:.2em;font-weight:700}
.opts{display:grid;gap:10px;grid-template-columns:1fr}
@media (min-width:560px){.opts{grid-template-columns:1fr 1fr}}
.opt{display:flex;gap:12px;align-items:center;text-align:left;min-height:56px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-family:var(--f-jp);font-size:1.15rem;color:var(--fg);cursor:pointer;min-width:0}
.opt span{min-width:0;overflow-wrap:anywhere}
.opt kbd{font:600 .72rem var(--f-ui);color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 6px;flex:none}
.opt.meaning{font-family:var(--f-ui);font-size:.97rem}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.correct{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.dim{opacity:.55}
.opt[disabled]{cursor:default}
.fb{border-radius:12px;padding:14px;display:grid;gap:8px}
.fb.ok{background:var(--good-soft)}
.fb.no{background:var(--bad-soft)}
.fb .status{font-weight:700}
.wordline{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.wordline b{font:700 1.5rem/1.2 var(--f-kanji)}
.wordline .rd{font-family:var(--f-jp);font-size:1.05rem}
.kin{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.88rem}
.kin span{font-family:var(--f-jp)}
.score{font:700 3rem/1 var(--f-kanji)}
.miss{display:grid;gap:0}
.miss div{display:flex;flex-wrap:wrap;gap:2px 12px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line)}
.miss b{font:700 1.15rem var(--f-kanji)}
.miss .rd{font-family:var(--f-jp)}
/* plan */
.days{display:grid;gap:8px}
.day{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.day.today{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.day.done .dt{color:var(--muted);text-decoration:line-through}
.dn{text-align:center;font:700 1.3rem/1 var(--f-kanji)}
.dn small{display:block;font:600 .62rem var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.dt{font-weight:600}
.dd{font-size:.84rem;color:var(--muted)}
.day input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent)}
.steps{margin:0;padding-left:1.2em;display:grid;gap:6px}
/* stories */
.sent{font-family:var(--f-jp);font-size:1.25rem;line-height:2.2;margin:0}
.tr{color:var(--muted);font-size:.88rem;line-height:1.45;margin:0 0 10px}
.notr .tr{display:none}
.w{font:inherit;color:inherit;background:none;border:0;border-bottom:2px dotted var(--accent);padding:0 1px;cursor:pointer;border-radius:2px;line-height:inherit}
.w.plain{border-bottom-color:var(--muted)}
.w:hover,.w.sel{background:var(--accent-soft)}
rt{display:none;font-size:.5em;color:var(--accent);font-family:var(--f-jp)}
.furi rt,.w.show rt{display:ruby-text}
.info{min-height:3.4em;padding:10px 12px;border-radius:10px;background:var(--surface-2);margin-top:10px;font-size:.92rem}
.info b{font:700 1.1rem var(--f-kanji)}
/* pairs */
.pairs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px 14px}
.pc{display:grid;gap:2px;text-align:left;font:inherit;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;min-height:68px;min-width:0}
.pc b{font:700 1.3rem/1.25 var(--f-kanji);overflow-wrap:anywhere}
.pc span{font-size:.84rem;color:var(--muted);overflow-wrap:anywhere}
.pc.sel{border-color:var(--accent);background:var(--accent-soft)}
.pc.done{border-color:var(--good);background:var(--good-soft);cursor:default}
.pc.shake{border-color:var(--bad);background:var(--bad-soft)}
/* clues */
.cg{display:grid;gap:10px}
.cg ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.cg li{display:flex;gap:10px;align-items:baseline}
.cg li button{font:700 1.5rem/1.1 var(--f-kanji);background:var(--surface-2);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:2px 8px;cursor:pointer;flex:none;min-width:2.1em}
.cg li button:hover{border-color:var(--accent)}
/* web */
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
.kb{aspect-ratio:1;max-width:100%;font:700 1.35rem var(--f-kanji);background:var(--surface);border:1px solid var(--line);color:var(--fg);border-radius:10px;cursor:pointer;padding:0}
.kb:hover{border-color:var(--accent)}
.kb[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.kb.seen{background:var(--accent-soft)}
.big{font:700 4.5rem/1 var(--f-kanji)}
.kd{display:grid;gap:12px}
.kdh{display:flex;gap:16px;align-items:center}
.wr{display:flex;flex-wrap:wrap;gap:2px 14px;align-items:baseline;padding:9px 0;border-top:1px solid var(--line)}
.wr b{font:700 1.25rem var(--f-kanji)}
.wr .rd{font-family:var(--f-jp);min-width:0}
.wr .mn{color:var(--muted);font-size:.9rem;min-width:0}
.wr .ch{font-size:.72rem;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:0 7px}
.cover{filter:blur(6px);cursor:pointer;user-select:none}
.cover.open{filter:none}
/* tappable kanji and the kanji popup */
.kj{cursor:pointer;border-radius:5px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.kj:hover{background:var(--accent-soft)}
.kjc{font:700 1.05rem var(--f-kanji)}
.scrim{position:fixed;inset:0;background:rgba(8,12,24,.6);z-index:30}
.scrim[hidden]{display:none}
.sheet{position:fixed;z-index:31;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,640px);max-height:88%;overflow-y:auto;overscroll-behavior:contain;
  background:var(--surface);color:var(--fg);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;
  padding:16px max(16px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));
  display:grid;gap:16px;align-content:start;animation:sheetup .2s ease-out}
.sheet[hidden]{display:none}
@keyframes sheetup{from{transform:translate(-50%,24px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@media (min-width:700px){.sheet{bottom:auto;top:50%;max-height:84%;border-bottom:1px solid var(--line);border-radius:20px;animation:none;transform:translate(-50%,-50%)}}
.sh-top{display:flex;justify-content:space-between;gap:8px}
.sh-top .btn:last-child{margin-left:auto}
.sh-hero{display:flex;gap:18px;align-items:center}
.sh-hero .big{font:700 5.4rem/1 var(--f-kanji);flex:none}
.sh-m{display:grid;gap:4px;min-width:0}
.sh-mean{font-size:1.2rem;font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.rdg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rdg>div{background:var(--surface-2);border-radius:12px;padding:10px 12px;min-width:0}
.rdg .jp{font:500 1.15rem/1.5 var(--f-jp);overflow-wrap:anywhere}
.clue{background:var(--accent-soft);border-radius:12px;padding:10px 12px}
.sw{display:grid;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.swh{display:flex;flex-wrap:wrap;gap:2px 12px;align-items:baseline}
.swh b{font:700 1.3rem var(--f-kanji)}
.swh .rd{font-family:var(--f-jp)}
.swh .mn{color:var(--muted);font-size:.9rem;min-width:0}
.swn{color:var(--muted);margin:0}
.bk{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.plus{color:var(--muted);font-weight:700}
.part{display:inline-flex;gap:8px;align-items:baseline;font:inherit;padding:4px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;min-height:36px;max-width:100%}
.part b{font:700 1.2rem var(--f-kanji)}
.part span{font-size:.82rem;color:var(--muted);overflow-wrap:anywhere}
.part:hover{border-color:var(--accent)}
.part.cur{background:var(--accent-soft);border-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.88rem;z-index:20;max-width:calc(100% - 32px)}
.toast[hidden]{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<style>html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<div class="shell">
  <header class="masthead">
    <div>
      <p class="eyebrow">JLPT N4 · Bab 1–20</p>
      <h1>N4 Kanji Lab<span>漢字</span></h1>
    </div>
    <div class="daypill" id="daypill"></div>
  </header>
  <nav class="tabs" id="tabs" aria-label="Sections">
    <a href="#plan" data-tab="plan">Plan</a>
    <a href="#practice" data-tab="practice">Practice</a>
    <a href="#stories" data-tab="stories">Stories</a>
    <a href="#pairs" data-tab="pairs">Pairs</a>
    <a href="#clues" data-tab="clues">Clues</a>
    <a href="#web" data-tab="web">Kanji web</a>
  </nav>
  <main>
    <section class="panel" id="p-plan"></section>
    <section class="panel" id="p-practice" hidden></section>
    <section class="panel" id="p-stories" hidden></section>
    <section class="panel" id="p-pairs" hidden></section>
    <section class="panel" id="p-clues" hidden></section>
    <section class="panel" id="p-web" hidden></section>
  </main>
</div>
<div class="toast" id="toast" hidden></div>
<div class="scrim" id="scrim" hidden></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Kanji detail" hidden></aside>

const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const isK=c=>/[一-鿿]/.test(c);

const V=[],BY=new Map();
(function(){

  document.getElementById('vocab').textContent.split('\n').forEach(l=>{
    l=l.trim();if(!l)return;
    if(l[0]==='='){ch=+l.slice(1);return}

    const p=l.split('|'),e=BY.get(p[0]);
    if(e){if(!e.chs.includes(ch))e.chs.push(ch);if(!e.heads.includes(head))e.heads.push(head)}
    else{const n={id:V.length,w:p[0],r:p[1],m:p[2],chs:[ch],heads:[head]};V.push(n);BY.set(n.w,n)}
  });
})();
const KIDX=new Map();
V.forEach(e=>[...new Set([...e.w].filter(isK))].forEach(k=>{if(!KIDX.has(k))KIDX.set(k,[]);KIDX.get(k).push(e)}));

const OPP=new Map();

/* sentences with [word] markers */
const MK=/\[([^\]|]+)(?:\|([^\]|]*))?(?:\|([^\]]*))?\]/g;
function parseSent(jp){
  const parts=[];let last=0,m;MK.lastIndex=0;
  while((m=MK.exec(jp))){
    if(m.index>last)parts.push({t:jp.slice(last,m.index)});
    const surface=m[1],key=m[3]||surface,e=BY.get(key)||null;
    parts.push({surface,key,e,infl:key!==surface,reading:m[2]||(e&&key===surface?e.r:'')});
    last=m.index+m[0].length;
  }
  if(last<jp.length)parts.push({t:jp.slice(last)});
  return parts;
}
const BLANKS=[];
STORIES.forEach((st,si)=>st.s.forEach(([jp,tr],ji)=>{
  const parts=parseSent(jp);
  parts.forEach((p,pi)=>{if(p.e&&!p.infl)BLANKS.push({si,ji,pi,parts,jp,tr,e:p.e})});
}));

/* wrong readings that look like real exam traps: long vowels, small っ, voicing */
const VOI={'か':'が','き':'ぎ','く':'ぐ','け':'げ','こ':'ご','さ':'ざ','し':'じ','す':'ず','せ':'ぜ','そ':'ぞ','た':'だ','ち':'ぢ','つ':'づ','て':'で','と':'ど','は':'ば','ひ':'び','ふ':'ぶ','へ':'べ','ほ':'ぼ'};
const UNV=Object.fromEntries(Object.entries(VOI).map(([a,b])=>[b,a]));
function mutate(r){
  const out=new Set();
  const rep=(re,s)=>{if(re.test(r))out.add(r.replace(re,s))};
  rep(/ょう/,'ょ');rep(/ゅう/,'ゅ');rep(/ょ(?!う)/,'ょう');rep(/ゅ(?!う)/,'ゅう');
  rep(/おう/,'お');rep(/おお/,'お');rep(/えい/,'え');rep(/お(?![うおっ])/,'おう');
  if(r.includes('っ'))out.add(r.replace('っ',''));
  else{
    const m=r.slice(1).search(/[かきくけこさしすせそたちつてとぱぴぷぺぽ]/);
    if(m>=0){const i=m+1;if(r[i-1]!=='ん')out.add(r.slice(0,i)+'っ'+r.slice(i))}
  }
  let n=0;
  for(const i of shuffle([...r].map((_,i)=>i))){
    const t=VOI[r[i]]||UNV[r[i]];
    if(t){out.add(r.slice(0,i)+t+r.slice(i+1));if(++n>=2)break}
  }
  out.delete(r);
  return shuffle([...out]).filter(x=>x.length>0);
}
function lookalike(w,r){
  const res=[];
  LOOK.forEach(g=>g.forEach(k=>{if(w.includes(k))g.forEach(o=>{if(o!==k)res.push(w.replace(k,o))})}));
  return shuffle(res).filter(s=>s!==w&&!(BY.get(s)&&BY.get(s).r===r));
}
function trapHint(e){
  if(/っ/.test(e.r))return 'Small っ doubles the next sound and makes a short stop.';
  if(/[ょゅ]う|おう|おお|えい/.test(e.r))return 'Long vowel: hold it for two beats. Short and long change the word.';
  if(/[ゃゅょ]/.test(e.r))return 'Small ゃ ゅ ょ blend into the kana before them.';
  return '';
}
const cat=w=>w.endsWith('する')?'s':isK(w[w.length-1])?'n':/い$/.test(w)?'a':/な$/.test(w)?'na':/[うくぐすつぬぶむる]$/.test(w)?'v':'o';

function fill(set,cands,n){for(const c of cands){if(set.size>=n)break;set.add(c)}return set}
function qReading(e){
  const o=new Set([e.r]);
  mutate(e.r).slice(0,2).forEach(x=>o.add(x));
  fill(o,shuffle(V).filter(x=>x!==e&&Math.abs(x.r.length-e.r.length)<=1).map(x=>x.r),4);
  return{type:'reading',e,tag:'Reading',ask:'How is the underlined word read?',html:kjWrap(e.w),cls:'u',options:shuffle([...o]),answer:e.r};
}
function qWriting(e){
  const o=new Set([e.w]),ks=[...e.w].filter(isK);
  lookalike(e.w,e.r).slice(0,1).forEach(x=>o.add(x));
  fill(o,shuffle(V).filter(x=>x!==e&&x.r!==e.r&&ks.some(k=>x.w.includes(k))).slice(0,2).map(x=>x.w),4);
  fill(o,shuffle(V).filter(x=>x!==e&&x.r!==e.r&&Math.abs(x.w.length-e.w.length)<=1).map(x=>x.w),4);
  return{type:'writing',e,tag:'Writing',ask:'Which kanji fits this reading?',html:esc(e.r),cls:'kana',options:shuffle([...o]),answer:e.w};
}
function qMeaning(e){
  const o=new Set([e.m]);
  fill(o,shuffle(V).filter(x=>x.m!==e.m&&fw(x.m)!==fw(e.m)).map(x=>x.m),4);
  return{type:'meaning',e,tag:'Meaning',ask:'What does it mean?',html:kjWrap(e.w),cls:'',options:shuffle([...o]),answer:e.m};
}
/* exam-style: one word underlined inside a story sentence; pick its reading, or the kanji for it */
function qContext(b){
  const e=b.e,rd=Math.random()<.5,base=rd?qReading(e):qWriting(e);
  const html=b.parts.map((p,i)=>p.t!==undefined?kjWrap(p.t):i===b.pi?`<span class="uw">${rd?kjWrap(p.surface):esc(e.r)}</span>`:kjWrap(p.surface)).join('');
  return Object.assign(base,{type:'context',tag:'In context',ask:rd?'How is the underlined word read?':'Which kanji fits the underlined word?',html,cls:'sent',tr:b.tr});
}

/* which words a practice session draws from */
const TRICKY=e=>/っ|ょう|ゅう|おう|おお|えい/.test(e.r);
function poolFor(s){
  if(s.kind==='chs')return V.filter(e=>e.chs.some(c=>s.chs.includes(c)));
  if(s.kind==='weak'){const w=store.get('weak',{});return V.filter(e=>w[e.w]>0)}
  if(s.kind==='tricky')return V.filter(TRICKY);
  if(s.kind==='repeat')return V.filter(e=>e.chs.length>1);
  if(s.kind==='kanji')return V.filter(e=>e.w.includes(s.k));
  return V;
}
function buildQuiz({fmt,n,scope,mock,noCtx}){
  const pool=poolFor(scope),notes=[];
  if(!pool.length)return{qs:[],notes:['No words in this selection yet.']};
  let ctx=BLANKS.filter(b=>pool.includes(b.e));
  if(!ctx.length){ctx=BLANKS;if(!noCtx&&(fmt==='context'||fmt==='mixed'||mock))notes.push('No story sentences use these words, so sentences from all stories are used.')}
  let types=[];
  if(mock){n=30;for(let i=0;i<30;i++)types.push(i<12?'reading':i<24?'writing':'context')}
  else{
    if(scope.kind!=='kanji')n=Math.min(n,fmt==='context'?ctx.length:pool.length);
    const cyc=noCtx?['reading','writing','meaning']:['reading','writing','meaning','context'];
    for(let i=0;i<n;i++)types.push(fmt==='mixed'?cyc[i%4]:fmt);
  }
  if(mock||fmt==='mixed')types=shuffle(types);
  const words=shuffle(pool),bl=shuffle(ctx);let wi=0,bi=0;
  const qs=types.map(t=>{
    if(t==='context')return qContext(bl[bi++%bl.length]);
    const e=words[wi++%words.length];
    return t==='reading'?qReading(e):t==='writing'?qWriting(e):qMeaning(e);
  });
  return{qs,notes};
}
function kin(e){
  const out=[];
  [...new Set([...e.w].filter(isK))].slice(0,2).forEach(k=>{
    const more=(KIDX.get(k)||[]).filter(x=>x!==e).slice(0,3);
    if(more.length)out.push(`<div class="kin"><b>${esc(k)}</b>${more.map(x=>`<span>${esc(x.w)} ${esc(x.r)}</span>`).join('')}</div>`);
  });
  return out.join('');
}

(function(){

const core=k=>{const e=KJ.get(k);return e?e.en.split(/[,;(]/)[0].replace(/^to /,'').trim():''};

const kjWrap=s=>[...s].map(c=>isK(c)&&KJ.has(c)?`<span class="kj" role="button" tabindex="0" data-kj="${c}">${c}</span>`:esc(c)).join('');
const kjChips=s=>[...new Set([...s].filter(c=>KJ.has(c)))].map(k=>`<button class="chip" data-kj="${k}"><b class="kjc">${k}</b> ${esc(core(k))}</button>`).join('');

function breakHtml(e,cur){

  return chips+(why?`<p class="swn small">${esc(why)}</p>`:'');
}
const SH={cur:null,stack:[],from:null,all:false};

function sheetWords(k){

function renderSheet(){

function openSheet(k,fromBack){
  const sh=$('#sheet');
  if(sh.hidden){SH.stack=[];SH.from=document.activeElement}
  else if(SH.cur&&SH.cur!==k&&!fromBack)SH.stack.push(SH.cur);
  SH.cur=k;SH.all=false;
  renderSheet();
  sh.hidden=false;$('#scrim').hidden=false;
  document.documentElement.style.overflow='hidden';
  sh.scrollTop=0;
  const x=$('#sh-x');if(x)x.focus({preventScroll:true});
}
function closeSheet(){
  const sh=$('#sheet');if(!sh||sh.hidden)return;
  sh.hidden=true;$('#scrim').hidden=true;
  document.documentElement.style.overflow='';
  const f=SH.from;SH.from=null;SH.stack=[];
  if(f&&document.contains(f)&&f.focus)f.focus({preventScroll:true});
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-kj]');
  if(t){e.preventDefault();openSheet(t.dataset.kj);return}
  if(e.target.id==='scrim'){closeSheet();return}
  if(!e.target.closest('#sheet'))return;
  const id=(e.target.closest('button')||{}).id;
  if(id==='sh-x')closeSheet();
  else if(id==='sh-back'){const p=SH.stack.pop();if(p)openSheet(p,true)}
  else if(id==='sh-more'){SH.all=true;renderSheet()}
  else if(id==='sh-web'){const k=SH.cur;closeSheet();openKanji(k)}
  else if(id==='sh-quiz'){const k=SH.cur;closeSheet();startKanjiQuiz(k)}
});
document.addEventListener('keydown',e=>{
  const sh=$('#sheet');
  if(sh&&!sh.hidden){
    if(e.key==='Escape'){closeSheet();return}
    if(e.key==='Tab'){
      const f=$$('button:not([hidden])',sh);if(!f.length)return;
      const a=f[0],z=f[f.length-1];
      if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}
      else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}
    }
  }
  const t=e.target;
  if((e.key==='Enter'||e.key===' ')&&t&&t.matches&&t.matches('.kj')){e.preventDefault();openSheet(t.dataset.kj)}
});

const mmss=ms=>{const s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};

    <div class="bar"><i style="width:${Q.i/n*100}%"></i></div>
    ${Q.i===0&&Q.notes.length?`<p class="small muted">${esc(Q.notes[0])}</p>`:''}
    <div class="card stage"><p class="eyebrow">${q.ask}</p><div class="prompt ${q.cls}">${q.html}</div>${q.html.includes('data-kj')?'<p class="small muted">Tap any kanji to see its readings and meaning.</p>':''}</div>
    <div class="opts" id="opts">${q.options.map((o,k)=>`<button class="opt ${q.type==='meaning'?'meaning':''}" data-k="${k}"><kbd>${k+1}</kbd><span>${esc(o)}</span></button>`).join('')}</div>
    <div id="fb"></div>
    <div class="row"><button class="btn small" id="quit">End quiz</button></div>
  </div>`;
  Q.done=false;
  $('#opts').onclick=e=>{const b=e.target.closest('.opt');if(b)answer(+b.dataset.k)};
  $('#quit').onclick=()=>renderSetup();
}
function answer(k){
  if(!Q||Q.done)return;
  const q=Q.qs[Q.i],e=q.e,ok=q.options[k]===q.answer;
  Q.done=true;
  if(ok)Q.score++;else Q.missed.push(e);
  markWord(e,ok);
  $$('#opts .opt').forEach((b,i)=>{b.disabled=true;if(q.options[i]===q.answer)b.classList.add('correct');else if(i===k)b.classList.add('wrong');else b.classList.add('dim')});
  const last=Q.i===Q.qs.length-1,hint=trapHint(e);
  $('#fb').innerHTML=`<div class="fb ${ok?'ok':'no'}">
    <p class="status">${ok?'Correct':'Not quite'}</p>
    <div class="wordline"><b>${kjWrap(e.w)}</b><span class="rd">${esc(e.r)}</span><span>${esc(e.m)}</span></div>
    ${breakHtml(e)}
    ${q.tr?`<p class="small">${esc(q.tr)}</p>`:''}
    ${hint&&q.type!=='meaning'?`<p class="small">${hint}</p>`:''}
    ${kin(e)}
    <div class="row"><button class="btn primary" id="next">${last?'See results':'Next'}</button></div></div>`;
  const nx=$('#next');nx.onclick=()=>{Q.i++;last?renderResults():renderQ()};nx.focus();
}
function renderResults(){
  clearInterval(Q.timer);
  const n=Q.qs.length,pct=Math.round(Q.score/n*100),m=Q.missed;
  const uniq=[...new Map(m.map(e=>[e.w,e])).values()];
  px().innerHTML=`
  <div class="card stack">
    <p class="eyebrow">Results${Q.mock?' · '+mmss(Date.now()-Q.t0):''}</p>
    <div class="score">${Q.score} / ${n}</div>
    <p>${pct>=85?'Strong round. Keep it fresh with a mixed set tomorrow.':pct>=60?'Getting there. The words below are the ones to revisit.':'Normal at this stage. Read the missed words below, then retry them.'}</p>
    <div class="row"><button class="btn primary" id="again">Same setup again</button>${uniq.length?`<button class="btn" id="retry">Retry missed (${uniq.length})</button>`:''}<button class="btn" id="back">Change setup</button></div>
  </div>
  ${uniq.length?`<div class="card stack"><h3>Words to revisit</h3><div class="miss">${uniq.map(e=>`<div><b>${esc(e.w)}</b><span class="rd">${esc(e.r)}</span><span class="muted small">${esc(e.m)}</span></div>`).join('')}</div></div>`:''}`;
  $('#again').onclick=()=>startQuiz(Q.mock);
  const rt=$('#retry');if(rt)rt.onclick=()=>{SETUP.kind='weak';SETUP.fmt='reading';SETUP.n=Math.min(20,Math.max(10,uniq.length));store.set('setup',SETUP);startQuiz(false)};
  $('#back').onclick=()=>renderSetup();
}
document.addEventListener('keydown',e=>{
  if(TAB!=='practice'||!Q||e.metaKey||e.ctrlKey||e.altKey||!$('#sheet').hidden)return;
  const n=+e.key;
  if(n>=1&&n<=4&&!Q.done&&$('#opts')&&Q.qs[Q.i]&&n<=Q.qs[Q.i].options.length)answer(n-1);
});

/* ---- plan ---- */
const R=(a,b)=>Array.from({length:b-a+1},(_,i)=>a+i);
const NEW='Read the words aloud once, skim Clues for look-alikes, then quiz Reading and Writing.';
const PLAN=[
  {t:'Bab 1–2',chs:[1,2],d:NEW},{t:'Bab 3',chs:[3],d:NEW},{t:'Bab 4–5',chs:[4,5],d:NEW},{t:'Bab 6',chs:[6],d:NEW},
  {t:'Bab 7–8',chs:[7,8],d:NEW},{t:'Bab 9',chs:[9],d:NEW},
  {t:'Catch-up and review Bab 1–9',chs:R(1,9),d:'A mixed quiz. Play Pairs and read two stories.'},
  {t:'Bab 10–11',chs:[10,11],d:NEW},{t:'Bab 12',chs:[12],d:NEW},{t:'Bab 13–14',chs:[13,14],d:NEW},
  {t:'Bab 15',chs:[15],d:NEW},{t:'Bab 16–17',chs:[16,17],d:NEW},{t:'Bab 18',chs:[18],d:NEW},{t:'Bab 19–20',chs:[19,20],d:NEW},
  {t:'Review Bab 1–7',chs:R(1,7),d:'Mixed quiz. Missed words enter the weak list.'},
  {t:'Review Bab 8–14',chs:R(8,14),d:'Mixed quiz. Then one story.'},
  {t:'Review Bab 15–20',chs:R(15,20),d:'Mixed quiz. Then one story.'},
  {t:'Tricky readings and repeated words',kind:'tricky',d:'Long vowels, small っ and words that appear in several chapters.'},
  {t:'Mock test',mock:true,d:'30 timed questions. Do it in one sitting.'},
  {t:'Weak words only',kind:'weak',d:'Drill what the mock test and quizzes flagged.'},
  {t:'Light review, then rest',kind:'weak',d:'Ten minutes of weak words. Sleep early.'}
];
const dayNum=s=>{const [y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)/864e5};
const todayNum=()=>{const t=new Date();return Date.UTC(t.getFullYear(),t.getMonth(),t.getDate())/864e5};
function planDay(){return Math.floor(todayNum()-dayNum(store.get('start','2026-11-17')))+1}
function renderPill(){
  const d=planDay();
  $('#daypill').innerHTML=d<1?`<b>${1-d}</b>days to start`:d>21?`<b>21+</b>plan finished`:`<b>${d}</b>day of 21`;
}
function renderPlan(){
  const done=store.get('done',{}),d=planDay(),nd=Object.keys(done).filter(k=>done[k]).length;
  const dup=V.filter(e=>e.chs.length>1).length;
  $('#p-plan').innerHTML=`
  <div class="card stack">
    <h2>Three weeks to N4</h2>
    <p class="muted">${V.length} words from 20 chapters. Aim to recognise kanji, not to write them: the exam asks you to read a word or pick the right kanji.</p>
    <div class="bar"><i style="width:${nd/21*100}%"></i></div>
    <div class="row small muted"><span>${nd} of 21 days done</span><span>·</span><span>${weakCount()} weak words</span><span>·</span><span>${dup} words repeat across chapters</span></div>
    <div class="row"><label class="lbl" for="startdate">Day 1 is<input class="field" type="date" id="startdate" value="${esc(store.get('start','2026-11-17'))}"></label></div>
  </div>
  <div class="days" id="days">${PLAN.map((p,i)=>{
    const cnt=p.chs?V.filter(e=>e.chs.some(c=>p.chs.includes(c))).length:null;
    return `<div class="day${d===i+1?' today':''}${done[i]?' done':''}">
      <div class="dn"><small>Day</small>${i+1}</div>
      <div><div class="dt">${esc(p.t)}</div><div class="dd">${esc(p.d)}${cnt?' · '+cnt+' words':''}</div></div>
      <div class="row"><button class="btn small primary" data-go="${i}">${p.mock?'Start':'Practise'}</button><input type="checkbox" data-done="${i}" aria-label="Day ${i+1} done" ${done[i]?'checked':''}></div>
    </div>`}).join('')}</div>
  <div class="card stack">
    <h3>A 30-minute day, without flashcards</h3>
    <ol class="steps">
      <li>Open Kanji web and scan the day's kanji. Say each word aloud.</li>
      <li>Read one story in Stories. Tap only the words you cannot read.</li>
      <li>Play Pairs for the opposites you just met.</li>
      <li>Take a mixed quiz of the day's chapters. Finish with your weak list.</li>
    </ol>
  </div>
  <details class="card small"><summary><b>Corrections to your PDF</b></summary>
    <div class="stack" style="margin-top:10px">
      <p>Bab 16: the group headed 屋 (教室, 地下室…) is actually 室.</p>
      <p>Bab 15: 科学 under 化 should be 化学 (kimia). 科学 (sains) is in Bab 9.</p>
      <p>Meanings tightened: 作業 is work or a task, not manufacturing. 夜食 is a late-night snack. 持ち物 is belongings. 学問 is learning. 暗号 is a code. 死者 is a deceased person.</p>
      <p>良い can be read よい or いい. Two unfinished rows (～～台 and 25度) were left out.</p>
    </div>
  </details>`;
  $('#startdate').onchange=e=>{if(e.target.value){store.set('start',e.target.value);renderPlan();renderPill()}};
  $('#days').onclick=e=>{
    const g=e.target.closest('[data-go]');
    if(g){const p=PLAN[+g.dataset.go];
      if(p.mock)launch({},true);
      else if(p.kind)launch({kind:p.kind,fmt:'mixed',n:20});
      else launch({kind:'chs',chs:p.chs,fmt:'mixed',n:20});
    }
  };
  $('#days').onchange=e=>{
    const c=e.target.closest('[data-done]');
    if(c){const dn=store.get('done',{});dn[c.dataset.done]=c.checked;store.set('done',dn);renderPlan()}
  };
}
/* ---- stories ---- */
let FURI=store.get('furi',false),TR=store.get('tr',true);
function renderStories(){
  const el=$('#p-stories');
  el.innerHTML=`
  <div class="card stack">
    <h2>Read, then tap what you can't</h2>
    <p class="muted small">Dotted words come from your N4 list. Tap one for its reading and meaning. Everything else is in kana.</p>
    <div class="row"><button class="chip" id="t-furi" aria-pressed="${FURI}">Show readings</button><button class="chip" id="t-tr" aria-pressed="${TR}">Show translation</button></div>
  </div>
  ${STORIES.map((st,si)=>{
    const need=Math.max(...st.s.flatMap(([jp])=>parseSent(jp).filter(p=>p.e).map(p=>Math.min(...p.e.chs))));
    return `<div class="card stack story" data-si="${si}">
      <div class="row" style="justify-content:space-between"><h3>${esc(st.t)}</h3><span class="eyebrow">Up to Bab ${need}</span></div>
      ${st.s.map(([jp,tr])=>`<div><p class="sent">${parseSent(jp).map(p=>p.t!==undefined?esc(p.t):`<button class="w${p.e?'':' plain'}" data-key="${esc(p.key)}" data-sf="${esc(p.surface)}" data-rd="${esc(p.reading)}"><ruby>${esc(p.surface)}<rt>${esc(p.reading)}</rt></ruby></button>`).join('')}</p><p class="tr">${esc(tr)}</p></div>`).join('')}
      <div class="info">Tap a dotted word.</div>
      <div class="row"><button class="btn small" data-quiz="${si}">Quiz me on this story</button></div>
    </div>`}).join('')}`;
  el.classList.toggle('furi',FURI);el.classList.toggle('notr',!TR);
  $('#t-furi').onclick=e=>{FURI=!FURI;store.set('furi',FURI);e.currentTarget.setAttribute('aria-pressed',FURI);el.classList.toggle('furi',FURI)};
  $('#t-tr').onclick=e=>{TR=!TR;store.set('tr',TR);e.currentTarget.setAttribute('aria-pressed',TR);el.classList.toggle('notr',!TR)};
  el.onclick=e=>{
    const w=e.target.closest('.w'),q=e.target.closest('[data-quiz]');
    if(w){
      const card=w.closest('.story'),en=BY.get(w.dataset.key);
      $$('.w.sel',card).forEach(x=>x.classList.remove('sel'));w.classList.add('sel');w.classList.toggle('show');
      const rd=w.dataset.rd,sf=w.dataset.sf;
      const kc=kjChips(sf);
      $('.info',card).innerHTML=(en
        ?`<b>${esc(sf)}</b> ${esc(rd)} · ${esc(en.m)}${sf!==en.w?`<br><span class="muted small">Form of ${esc(en.w)} ${esc(en.r)}</span>`:''}<br><span class="muted small">Bab ${en.chs.join(', ')}</span>`
        :`<b>${esc(sf)}</b> ${esc(rd)}<br><span class="muted small">Not in your list.</span>`)
        +(kc?`<div class="chips" style="margin-top:8px">${kc}</div>`:'');
    }
    if(q){
      const si=+q.dataset.quiz,by=new Map();
      BLANKS.filter(b=>b.si===si).forEach(b=>{(by.get(b.ji)||by.set(b.ji,[]).get(b.ji)).push(b)});
      const qs=shuffle([...by.values()].map(a=>qContext(a[Math.floor(Math.random()*a.length)])));
      Q={qs,i:0,score:0,missed:[],done:false,mock:false,t0:Date.now(),timer:null,notes:[]};
      go('practice');renderQ();
    }
  };
}

/* ---- pairs ---- */
let PR=null,PRounds=0;
function newRound(){
  const pick=shuffle(PAIRS).slice(0,6).map(p=>Math.random()<.5?p:[p[1],p[0]]);
  PR={left:shuffle(pick.map(p=>p[0])),right:shuffle(pick.map(p=>p[1])),sel:null,done:new Set(),miss:0,flash:null};
  PRounds++;renderPairs();
}
function renderPairs(){
  const el=$('#p-pairs'),fin=PR.done.size===12;
  el.innerHTML=`
  <div class="card stack">
    <h2>Match the opposites</h2>
    <p class="muted small">Tap a word, then tap the word that pairs with it: opposites, or the other half of a set. Round ${PRounds} · ${PR.miss} slip${PR.miss===1?'':'s'}</p>
  </div>
  <div class="pairs" id="pgrid">${PR.left.map((l,i)=>[['l',l],['r',PR.right[i]]].map(([s,k])=>{
    const e=BY.get(k),d=PR.done.has(k);
    return `<button class="pc${d?' done':''}${PR.sel&&PR.sel.k===k?' sel':''}${PR.flash===k?' shake':''}" data-k="${esc(k)}" data-s="${s}"><b>${esc(k)}</b><span>${esc(e.m)}${d?' · '+esc(e.r):''}</span></button>`}).join('')).join('')}</div>
  ${fin?`<div class="card stack"><h3>All matched</h3><p class="muted small">${PR.miss?PR.miss+' slips this round. ':'No slips. '}Play another round for a fresh set.</p><div class="row"><button class="btn primary" id="pnext">Next round</button></div></div>`:''}`;
  $('#pgrid').onclick=e=>{
    const b=e.target.closest('.pc');if(!b||PR.done.has(b.dataset.k)||fin)return;
    const k=b.dataset.k,s=b.dataset.s;
    if(!PR.sel||PR.sel.s===s){PR.sel={k,s};PR.flash=null;renderPairs();return}
    if(OPP.get(PR.sel.k)===k){PR.done.add(k);PR.done.add(PR.sel.k);PR.sel=null;PR.flash=null}
    else{PR.miss++;PR.flash=k;PR.sel=null;setTimeout(()=>{if(PR){PR.flash=null;if(TAB==='pairs')renderPairs()}},600)}
    renderPairs();
  };
  const n=$('#pnext');if(n)n.onclick=newRound;
}

/* ---- clues ---- */
const TRAPS=['病院','特急','一回','急用','首相','習字','兄弟','紅茶','旅行する','注文する','入院する','実験','切手','作家','借金','出発する'];
function renderClues(){
  $('#p-clues').innerHTML=`
  <div class="card stack"><h2>Clues for look-alikes</h2><p class="muted small">Small stories and radical hints. Tap a kanji for its readings, meaning and every word that uses it.</p></div>
  ${CLUES.map(c=>`<div class="card cg"><h3>${esc(c.t)}</h3><p class="muted small">${esc(c.n)}</p><ul>${c.i.map(([k,d])=>`<li><button data-kj="${esc(k)}" aria-label="Open ${esc(k)} details">${esc(k)}</button><span>${esc(d)}</span></li>`).join('')}</ul></div>`).join('')}
  <div class="card stack"><h3>Reading traps</h3>
    <p class="muted small">Exam wrong answers usually change a long vowel, a small っ or a voiced sound. Say these aloud, then drill them.</p>
    <div class="miss">${TRAPS.map(k=>BY.get(k)).filter(Boolean).map(e=>`<div><b>${esc(e.w)}</b><span class="rd">${esc(e.r)}</span><span class="muted small">${esc(e.m)}</span></div>`).join('')}</div>
    <div class="row"><button class="btn primary" id="drill">Drill tricky readings</button></div>
  </div>`;
  $('#p-clues').onclick=e=>{
    const b=e.target.closest('[data-k]');if(b)openKanji(b.dataset.k);
    if(e.target.closest('#drill'))launch({kind:'tricky',fmt:'reading',n:20});
  };
}

/* ---- kanji web ---- */
let SELK=null,CV={r:false,m:false};
function openKanji(k){SELK=k;go('web');if($('#kd'))renderWeb()}
const seenMap=()=>store.get('seen',{});
function rowHtml(e){
  return `<div class="wr"><b>${kjWrap(e.w)}</b><span class="rd${CV.r?' cover':''}">${esc(e.r)}</span><span class="mn${CV.m?' cover':''}">${esc(e.m)}</span><span class="ch">Bab ${e.chs.join(', ')}</span></div>`;
}
function renderWeb(){
  const el=$('#p-web'),q=($('#wq')?$('#wq').value:'').trim();
  const seen=seenMap();
  if(SELK){seen[SELK]=1;store.set('seen',seen)}
  el.innerHTML=`
  <div class="card stack">
    <h2>Kanji web</h2>
    <p class="muted small">Every kanji in your list, with all the words that use it. A kanji you meet in three words is already half learned. ${Object.keys(seen).length} of ${HEADS.length} visited.</p>
    <input class="field" id="wq" type="search" placeholder="Search kanji, reading or Indonesian" value="${esc(q)}" aria-label="Search">
    <div class="row"><button class="chip" id="cv-r" aria-pressed="${CV.r}">Cover readings</button><button class="chip" id="cv-m" aria-pressed="${CV.m}">Cover meanings</button><span class="small muted">Tap a covered item to reveal it.</span></div>
  </div>
  <div class="card"><div class="kgrid" id="kgrid">${HEADS.map(k=>`<button class="kb${seen[k]?' seen':''}" data-k="${esc(k)}" aria-pressed="${k===SELK&&!q}">${esc(k)}</button>`).join('')}</div></div>
  <div class="card kd" id="kd">${detailHtml(q)}</div>`;
  $('#kgrid').onclick=e=>{const b=e.target.closest('.kb');if(b){SELK=b.dataset.k;$('#wq').value='';renderWeb();$('#kd').scrollIntoView({block:'nearest',behavior:'smooth'})}};
  $('#wq').oninput=e=>{const v=e.target.value.trim();$('#kd').innerHTML=detailHtml(v);$$('.kb').forEach(b=>b.setAttribute('aria-pressed',!v&&b.dataset.k===SELK))};
  $('#cv-r').onclick=()=>{CV.r=!CV.r;renderWeb()};
  $('#cv-m').onclick=()=>{CV.m=!CV.m;renderWeb()};
  $('#kd').onclick=e=>{
    const c=e.target.closest('.cover');if(c){c.classList.toggle('open');return}
    const r=e.target.closest('[data-k]');if(r){SELK=r.dataset.k;renderWeb()}
  };
}
function detailHtml(q){
  if(q){
    const s=q.toLowerCase();
    const hits=V.filter(e=>e.w.includes(q)||e.r.includes(q)||e.m.toLowerCase().includes(s));
    return `<p class="eyebrow">${hits.length} result${hits.length===1?'':'s'}</p>${hits.slice(0,80).map(rowHtml).join('')||'<p class="muted">Nothing matches. Try a single kanji or kana.</p>'}`;
  }
  if(!SELK)return '<p class="muted">Pick a kanji above to see where it appears.</p>';
  const ws=(KIDX.get(SELK)||[]).slice().sort((a,b)=>a.chs[0]-b.chs[0]);
  const rel=[...new Set(ws.flatMap(e=>[...e.w].filter(isK)))].filter(x=>x!==SELK);
  return `<div class="kdh"><div class="big">${esc(SELK)}</div><div class="stack" style="gap:6px"><div><h3>${ws.length} word${ws.length===1?'':'s'}</h3><p class="muted small">in your list</p></div><button class="btn small" data-kj="${esc(SELK)}">Readings and meaning</button></div></div>
    ${ws.map(rowHtml).join('')}
    ${rel.length?`<div class="group"><p class="eyebrow">Seen alongside</p><div class="chips">${rel.map(k=>`<button class="chip" data-k="${esc(k)}">${esc(k)}</button>`).join('')}</div></div>`:''}`;
}

/* ---- router ---- */
const TABS=['plan','practice','stories','pairs','clues','web'];
const rendered={};
const RENDER={plan:renderPlan,practice:()=>{if(!Q)renderSetup()},stories:renderStories,pairs:()=>{if(!PR)newRound()},clues:renderClues,web:renderWeb};
function route(){
  closeSheet();
  const h=location.hash.replace('#','');
  TAB=TABS.includes(h)?h:'plan';
  TABS.forEach(t=>{$('#p-'+t).hidden=t!==TAB});
  $$('#tabs a').forEach(a=>{if(a.dataset.tab===TAB)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  if(!rendered[TAB]||TAB==='plan'||TAB==='practice'){RENDER[TAB]();rendered[TAB]=true}
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
renderPill();
route();

})();
</script>
</body>
</html>
