<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>My Mood Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Patrick+Hand&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="journal">

<header class="top">
  <a class="brand" href="index.html">My Mood Journal</a>
  <nav class="nav" aria-label="Main">
    <a href="index.html" aria-current="page">Journal</a>
    <a href="admin.html">Write</a>
  </nav>
</header>

<main class="wrap">
  <section class="card filters tape" aria-label="Search and filter entries">
    <label class="fld grow"><span>Search</span>
      <input id="q" type="search" placeholder="Search your journal…" autocomplete="off"></label>
    <label class="fld"><span>Date</span><input id="f-date" type="date"></label>
    <label class="fld"><span>Month</span><input id="f-month" type="month"></label>
    <label class="fld"><span>Year</span>
      <select id="f-year"><option value="">All years</option></select></label>
    <label class="fld"><span>Emotion</span>
      <select id="f-emotion"><option value="">All emotions</option></select></label>
    <button id="f-clear" class="btn" type="button">Clear</button>
  </section>

  <p id="count" class="count" role="status"></p>
  <section id="feed" class="feed" aria-live="polite" aria-busy="true">
    <div class="state">Opening your journal…</div>
  </section>
</main>

<script src="script.js"></script>
</body>
</html>
