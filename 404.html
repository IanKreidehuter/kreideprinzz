<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{--pink:#ffd3e6;--butter:#fff0a6;--lav:#dccbff;--red:#ff4a5f;--purple:#8c5bd8;--blue:#3b8de0;--ink:#3b3452;
--wob:14px 24px 16px 22px/22px 14px 24px 16px;--hatch:repeating-linear-gradient(118deg,transparent 0 5px,rgba(255,255,255,.55) 5px 7px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{font-family:"Patrick Hand",cursive;color:var(--ink);background:var(--hatch),#c6e5ff;
 display:grid;place-items:center;
 padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
h1,p{margin:0}
h1,.code,figcaption{font-family:"Gochi Hand",cursive;font-weight:400}
:focus-visible{outline:3px dashed var(--purple);outline-offset:3px}

/* fixed 4:5 card that always fits the screen; everything inside scales with its width (cqw) */
.card{--w:min(calc(100vw - 24px),calc((100vh - 24px)*.8),760px);--w:min(calc(100vw - 24px),calc((100dvh - 24px)*.8),760px);
 position:relative;width:var(--w);aspect-ratio:4/5;container-type:inline-size;
 display:flex;flex-direction:column;overflow:hidden;
 background:var(--hatch),#fffdf8;border:3px solid #fff;border-radius:var(--wob);
 box-shadow:0 0 0 2px #a9d2f2,3px 5px 0 rgba(60,50,90,.1)}

.hero{position:relative;flex:0 0 63%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4cqw 0 9cqw;
 background:linear-gradient(transparent calc(100% - 9cqw),#9fdc6a calc(100% - 9cqw),#7fc94f 100%),repeating-linear-gradient(112deg,#8cc8f6 0 5px,#b4dcfb 5px 9px);
 clip-path:polygon(0 0,100% 0,100% 94%,94% 97%,88% 93%,80% 98%,70% 94%,60% 98%,50% 94%,40% 98%,30% 93%,20% 98%,10% 94%,0 97%)}

.pol{position:relative;width:38cqw;margin:0;padding:2cqw 2cqw 1.4cqw;background:#fffdf8;border:3px solid #fff;border-radius:var(--wob);
 box-shadow:0 0 0 2px #a9d2f2,3px 5px 0 rgba(60,50,90,.12);transform:rotate(-3deg);animation:wob 4s ease-in-out infinite}
.pol::before{content:"";position:absolute;top:-2.4cqw;left:50%;width:18cqw;height:4.6cqw;transform:translateX(-50%) rotate(-3deg);
 background:repeating-linear-gradient(90deg,#ffb3c9 0 8px,#fff 8px 16px);opacity:.85}
.pol img{display:block;width:100%;aspect-ratio:1;object-fit:contain;border-radius:6px;background:var(--pink)}
.pol figcaption{font-size:5.4cqw;line-height:1;margin-top:1cqw}

.code{margin-top:2.5cqw;font-size:20cqw;line-height:.9;transform:rotate(-5deg);text-shadow:2px 2px 0 #fff}
.code .r{color:var(--red)}.code .b{color:var(--blue)}.code .p{color:var(--purple)}

.sticker{position:absolute;font-size:8cqw;line-height:1;pointer-events:none;animation:bob 5s ease-in-out var(--d,0s) infinite}
.sticker.twinkle{animation:twinkle 2.6s ease-in-out var(--d,0s) infinite}

.body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:2.6cqw;padding:0 5cqw 4.5cqw;text-align:center}
.body h1{font-size:8.6cqw;line-height:1;background:linear-gradient(90deg,var(--red),var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent}
.paper{background:var(--butter);padding:2.4cqw 4cqw;font-size:4.5cqw;line-height:5.9cqw;border-radius:4px;box-shadow:2px 4px 0 rgba(60,50,90,.12);
 background-image:repeating-linear-gradient(transparent 0 5.75cqw,#e9d98a 5.75cqw 5.9cqw);transform:rotate(1.2deg)}
.btns{display:flex;gap:3cqw}
.lbl{flex:1;display:block;padding:1.8cqw 1cqw;text-decoration:none;font-size:5.4cqw;line-height:1.1;border-radius:var(--wob);box-shadow:2px 4px 0 rgba(60,50,90,.15);transition:transform .2s;color:inherit}
.c0{background:#bdf0b8;transform:rotate(-1.5deg)}.c1{background:var(--lav);transform:rotate(1deg)}
@media(hover:hover){.lbl:hover{transform:rotate(2deg) scale(1.05)}}

@keyframes bob{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-8px) rotate(calc(var(--r,0deg) + 4deg))}}
@keyframes twinkle{0%,100%{transform:scale(1) rotate(var(--r,0deg));opacity:1}50%{transform:scale(1.22) rotate(calc(var(--r,0deg) + 12deg));opacity:.7}}
@keyframes wob{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(1deg) translateY(-3px)}}
@media(prefers-reduced-motion:reduce){.sticker,.pol{animation:none!important}.lbl{transition:none}}
</style>
</head>
<body>
<main class="card">
  <div class="hero">
    <span class="sticker twinkle" style="left:6%;top:12%;--r:-10deg">⭐</span>
    <span class="sticker" style="right:6%;top:8%;--r:8deg;--d:.6s">🌈</span>
    <span class="sticker twinkle" style="left:8%;top:50%;--r:12deg;--d:1s;font-size:6cqw">✨</span>
    <span class="sticker" style="right:9%;top:48%;--r:-6deg;--d:1.4s;font-size:6.5cqw">🌱</span>
    <figure class="pol">
      <img src="/assets/baby2.png" alt="A surprised baby hugging a toy giraffe">
      <figcaption>Uh oh!</figcaption>
    </figure>
    <p class="code" aria-hidden="true"><span class="r">4</span><span class="b">0</span><span class="p">4</span></p>
  </div>
  <div class="body">
    <h1>Page not found</h1>
    <p class="paper">We looked everywhere, even behind the giraffe.</p>
    <div class="btns">
      <a class="lbl c0" href="/">Take me home</a>
      <a class="lbl c1" href="#" onclick="history.length>1?history.back():location.href='/';return false">Go back</a>
    </div>
  </div>
</main>
</body>
</html>
